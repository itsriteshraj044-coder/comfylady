# =============================================================================
# Rebuilds the site on every push to main and republishes the `dist` branch.
#
# The `dist` branch holds build output only, so it is rewritten as a single
# orphan commit each run and force-pushed. That keeps the branch a clean
# snapshot and stops the repository growing without bound, which it would if
# every build appended another copy of the hashed assets and images.
# =============================================================================

name: Publish dist branch

on:
  push:
    branches: [main]
    # Documentation-only changes cannot affect the build output.
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/**'
  workflow_dispatch:

# Only one publish at a time; a newer push supersedes an in-flight run.
concurrency:
  group: publish-dist
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, so CI cannot
      # drift from local. It fails loudly if the lockfile is out of sync.
      - name: Install dependencies
        run: npm ci

      # `npm run build` runs `tsc -b` first, so a type error fails the run and
      # a broken build is never published.
      - name: Build
        run: npm run build

      # public/.htaccess is copied into dist by Vite. vercel.json lives at the
      # repo root, so it has to be added by hand for anyone deploying the dist
      # branch directly as a static site.
      - name: Add host configuration to the output
        run: cp vercel.json dist/vercel.json

      - name: Verify the output looks right
        run: |
          set -e
          test -f dist/index.html   || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/.htaccess    || { echo "::error::dist/.htaccess missing"; exit 1; }
          test -f dist/vercel.json  || { echo "::error::dist/vercel.json missing"; exit 1; }
          test -d dist/assets       || { echo "::error::dist/assets missing"; exit 1; }
          images=$(find dist/images -name '*.jpg' | wc -l)
          # Not pinned to an exact count, so adding or removing artwork later
          # does not fail the build. This catches the real failure: none copied.
          test "$images" -ge 1      || { echo "::error::no images in dist/images"; exit 1; }
          echo "output verified: $images images, $(du -sh dist | cut -f1) total"

      - name: Publish to the dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd dist
          git init -q -b dist
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -F - <<COMMIT
          Build output from ${GITHUB_SHA::7}

          Compiled production build of the Comfylady site, generated by
          \`npm run build\` from main. This branch contains no source; it exists
          so the built site can be deployed or uploaded without a build step.

          Includes .htaccess for Apache/cPanel and vercel.json for Vercel, so
          client-side routes resolve instead of returning 404 on either.

          Do not edit this branch by hand — the next push to main overwrites it.
          Source commit: ${GITHUB_SHA}
          COMMIT
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
          echo "published dist branch from ${GITHUB_SHA::7}"
